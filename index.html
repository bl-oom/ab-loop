<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB往復ループ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0e0f12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Overpass+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/*
VOICE: 編集室の道具。静かで確実、操作に迷わない。
IDEA: 編集ソフトのタイムライン（IN/OUT点とループ範囲）。
PICTURE: 残りの高さいっぱいの映像プレビュー、その下にA-B範囲が光るタイムライン。
COLOUR/TYPE: 黒に近いモニター面、A=シアン、B=マゼンタ。Zen Kaku Gothic + 等幅数字。
LAYOUT: 常に1画面に収める。縦長画面は上プレビュー・下操作、幅広画面(Fold内画面)は左プレビュー・右操作。ボタン位置は固定。
*/
:root{color-scheme:dark;--bg:#0e0f12;--panel:#17191e;--line:#2a2d35;--ink:#eef0f4;--mute:#8b909c;--a:#22c7e0;--b:#ef3f8f;--go:#f2f2f2}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Zen Kaku Gothic New",system-ui,sans-serif;overflow:hidden}
.wrap{height:100dvh;display:flex;flex-direction:column;gap:8px;padding:max(8px,env(safe-area-inset-top)) 10px max(8px,env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
.side{display:contents}
h1{order:-1;font-size:16px;margin:0 2px;font-weight:700;flex:none}
.stage{order:0;position:relative;flex:1 1 auto;min-height:120px;background:#000;border-radius:12px;overflow:hidden;border:1px solid var(--line)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage canvas{display:none}
.stage.looping canvas{display:block}.stage.looping video{visibility:hidden}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);padding:20px;cursor:pointer}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.badge{position:absolute;left:8px;top:8px;font:600 12px "Overpass Mono",monospace;background:rgba(0,0,0,.65);padding:3px 9px;border-radius:99px;display:none}
.stage.looping .badge{display:block}
.side>*{order:1;flex:none}.side>h1{order:-1}
.tl{position:relative;height:40px;touch-action:none;cursor:pointer}
.track{position:absolute;left:0;right:0;top:16px;height:12px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.range{position:absolute;top:16px;height:12px;background:linear-gradient(90deg,var(--a),var(--b));opacity:.55;border-radius:6px;display:none}
.mk{position:absolute;top:12px;width:2px;height:24px;margin-left:-1px;display:none}
.mk span{position:absolute;top:-13px;left:50%;transform:translateX(-50%);font:700 11px "Overpass Mono",monospace;color:#000;border-radius:4px;padding:0 4px}
#mA{background:var(--a)}#mA span{background:var(--a)}#mB{background:var(--b)}#mB span{background:var(--b)}
.head{position:absolute;top:10px;width:4px;height:24px;margin-left:-2px;background:var(--go);border-radius:2px;box-shadow:0 0 0 2px #0008}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;font:600 14px "Overpass Mono",monospace}
.times div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px 8px;white-space:nowrap;display:flex;gap:6px;align-items:baseline;height:34px}
.times small{font:500 12px "Zen Kaku Gothic New",sans-serif;color:var(--mute)}
#tA{color:var(--a)}#tB{color:var(--b)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
button,select,.dl{font:700 14px "Zen Kaku Gothic New",sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;height:46px;padding:4px 2px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.15;width:100%}
label.btn{font:700 14px "Zen Kaku Gothic New",sans-serif;background:var(--panel);border:1px solid var(--line);border-radius:12px;height:46px;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
select{appearance:none;text-align-last:center;font-size:14px}
.setA{border-color:var(--a);color:var(--a)}.setB{border-color:var(--b);color:var(--b)}
.go{grid-column:span 4;height:52px;font-size:18px;background:var(--go);color:#111;border:0}
.go.on{background:#2b2e36;color:var(--go);border:2px solid var(--go)}
.wide2{grid-column:span 2}
.exp{border-color:var(--go)}
label.bgm{border-color:#f5b83d;color:#f5b83d;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 8px;display:block;line-height:44px}
label.bgm.has{background:#f5b83d;color:#1a1300}
.exp.rec{background:#c62828;border-color:#c62828;color:#fff}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:6px;align-items:center}
.note{color:var(--mute);font-size:12px;margin:0 2px;height:34px;overflow:hidden;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.dl{text-decoration:none;opacity:.35;pointer-events:none}
.dl.ready{opacity:1;pointer-events:auto;background:var(--a);color:#001418;border-color:var(--a)}
input[type=file]{display:none}
.sheet{position:absolute;inset:0;z-index:5;background:rgba(14,15,18,.96);padding:10px;display:flex;flex-direction:column;gap:8px;overflow:auto}
.sheet[hidden]{display:none}
.shd{display:flex;justify-content:space-between;align-items:baseline;color:#f5b83d}.shd span{font:600 14px "Overpass Mono",monospace;color:var(--ink)}
.rg2{background:#f5b83d}
#bmA,#bmB{background:#f5b83d}#bmA span,#bmB span{background:#f5b83d}
.okb{background:var(--go);color:#111;border:0}
/* 横長の画面（タブレット横向きなど）：左プレビュー、右操作 */
@media (min-width:700px) and (min-aspect-ratio:5/4){
  .wrap{max-width:none;display:grid;grid-template-columns:minmax(0,1fr) 380px;grid-template-rows:minmax(0,1fr);gap:12px;padding:12px}
  .stage{height:100%}
  .side{display:flex;flex-direction:column;gap:10px;overflow:auto}
  h1{font-size:20px}
  button,select,.dl,label.btn{height:54px;font-size:15px}
  .go{height:60px}
  label.bgm{line-height:52px}
}
/* 横向きスマホなど高さが低いとき */
@media (max-height:520px) and (min-aspect-ratio:1/1){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-rows:minmax(0,1fr);gap:8px;max-width:none}
  .stage{height:100%}
  .side{display:flex;flex-direction:column;gap:6px;overflow:auto}
  h1{display:none}
}
@media (max-height:700px) and (max-aspect-ratio:1/1){h1{display:none}}
/* Fold内画面など幅が広い縦〜正方形：操作ボタンを大きく */
@media (min-width:700px) and (max-aspect-ratio:5/4){
  .wrap{max-width:820px;gap:10px;padding:12px}
  button,select,.dl,label.btn{height:52px;font-size:15px}
  .go{height:58px}
  label.bgm{line-height:50px}
}
</style>
</head>
<body>
<div class="wrap">
<div class="stage" id="stage">
  <video id="v" playsinline preload="auto"></video>
  <canvas id="cv"></canvas>
  <div class="badge" id="badge">▶ A→B</div>
  <div class="sheet" id="sheet" hidden>
    <div class="shd"><b>裏の音のA・B</b><span id="bnow">0:00.00</span></div>
    <div class="tl" id="btl"><div class="track"></div><div class="range rg2" id="brange"></div>
      <div class="mk" id="bmA"><span>A</span></div><div class="mk" id="bmB"><span>B</span></div><div class="head" id="bhead" style="left:0"></div></div>
    <div class="times"><div><small>A</small><span id="btA">頭</span></div><div><small>B</small><span id="btB">最後</span></div><div><small>長さ</small><span id="bdur">--</span></div></div>
    <div class="grid">
      <button id="bback">◀ 1秒</button><button id="bplay">試聴</button><button id="bfwd">1秒 ▶</button><button id="bok" class="okb">閉じる</button>
      <button class="setA" id="bsetA">ここを音A</button><button class="setB" id="bsetB">ここを音B</button><button id="breset">リセット</button><button id="bclr">音を外す</button>
    </div>
  </div>
  <label class="empty" id="empty" for="file"><div><b>動画を選ぶ</b>端末に保存されている動画をタップして開く</div></label>
</div>
<div class="side">
<h1>AB往復ループ</h1>
<div class="tl" id="tl">
  <div class="track"></div>
  <div class="range" id="range"></div>
  <div class="mk" id="mA"><span>A</span></div>
  <div class="mk" id="mB"><span>B</span></div>
  <div class="head" id="head" style="left:0"></div>
</div>
<div class="times">
  <div><small>今</small><span id="tN">0:00.00</span></div>
  <div><small>A</small><span id="tA">--</span></div>
  <div><small>B</small><span id="tB">--</span></div>
</div>
<div class="grid">
  <button id="back">◀ 1コマ</button>
  <button id="play">再生</button>
  <button id="fwd">1コマ ▶</button>
  <label class="btn" for="file">動画変更</label>
  <button class="setA wide2" id="setA">ここをA点に</button>
  <button class="setB wide2" id="setB">ここをB点に</button>
  <button class="go" id="go" disabled>往復ループ開始</button>
  <select id="spd" aria-label="速度">
    <option value="0.25">速度0.25</option><option value="0.5">速度0.5</option>
    <option value="1" selected>速度1倍</option><option value="1.5">速度1.5</option><option value="2">速度2倍</option>
  </select>
  <select id="q" aria-label="画質">
    <option value="540">画質 軽</option><option value="720" selected>画質 標準</option><option value="1080">画質 高</option>
  </select>
  <select id="rep" aria-label="往復回数">
    <option value="1">往復1回</option><option value="2">往復2回</option><option value="3" selected>往復3回</option>
    <option value="5">往復5回</option><option value="10">往復10回</option><option value="20">往復20回</option>
  </select>
  <button id="exp" class="exp" disabled>書き出し</button>
  <label class="btn bgm wide2" for="bfile" id="bname">♪ 裏の音を選ぶ</label>
  <select id="bvol" aria-label="裏の音の音量">
    <option value="1" selected>音量100</option><option value="0.7">音量70</option><option value="0.5">音量50</option><option value="0.3">音量30</option>
  </select>
  <button id="bopen" disabled>音の範囲</button>
</div>
<div class="bar">
  <p class="note" id="note">A点とB点を決めて「往復ループ開始」。B→Aは逆再生。元の音は流れず、「裏の音」を選ぶとその音だけ流れます。</p>
  <a id="dl" class="dl">保存</a>
</div>
</div>
<input type="file" id="file" accept="video/*">
<input type="file" id="bfile" accept="audio/*,video/*">
<audio id="bgm" loop preload="auto"></audio>
</div>

<script>
{
const $=id=>document.getElementById(id);
const v=$('v'),cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),note=$('note');
let A=null,B=null,url=null,fps=30;
let rec=null,chunks=[],recOn=false,expPending=false,cycles=0,recMime='';
const bgm=$('bgm');let bUrl=null,actx=null,gain=null,adest=null;
function audioInit(){
  if(actx)return;
  try{actx=new (window.AudioContext||window.webkitAudioContext)();
    const src=actx.createMediaElementSource(bgm);gain=actx.createGain();adest=actx.createMediaStreamDestination();
    src.connect(gain);gain.connect(actx.destination);gain.connect(adest);gain.gain.value=+$('bvol').value;
  }catch(e){actx=null}
}
function bgmPlay(fromStart){if(!bUrl)return;audioInit();if(actx&&actx.state==='suspended')actx.resume();if(fromStart)bgm.currentTime=bA||0;bgm.play().catch(()=>{})}
let bA=null,bB=null,bPrev=false;bgm.loop=false;
const bEnd=()=>bB!=null?bB:(bgm.duration||0);
// 音のループ：A→Bまで流れたら瞬時にAへ戻る
function bWrap(){const a=bA||0;if(bB!=null&&bgm.currentTime>=bB){bgm.currentTime=a}}
bgm.onended=()=>{if(bPrev||looping){bgm.currentTime=bA||0;bgm.play().catch(()=>{})}};
bgm.ontimeupdate=()=>{bWrap();bui()};
(function bw(){if(!bgm.paused)bWrap();if(!$('sheet').hidden)bui();requestAnimationFrame(bw)})();
const bpct=x=>((bgm.duration?x/bgm.duration:0)*100)+'%';
function bui(){
  const d=bgm.duration||0;$('bdur').textContent=d?fmt(d):'--';$('bnow').textContent=fmt(bgm.currentTime);
  $('bhead').style.left=bpct(bgm.currentTime);
  $('btA').textContent=bA!=null?fmt(bA):'頭';$('btB').textContent=bB!=null?fmt(bB):'最後';
  $('bmA').style.display=bA!=null?'block':'none';$('bmA').style.left=bpct(bA||0);
  $('bmB').style.display=bB!=null?'block':'none';$('bmB').style.left=bpct(bB||0);
  const a=bA||0,b=bEnd();const rg=$('brange');
  if(d&&(bA!=null||bB!=null)){rg.style.display='block';rg.style.left=bpct(a);rg.style.width=((b-a)/d*100)+'%'}else rg.style.display='none';
  $('bplay').textContent=(!bgm.paused&&bPrev)?'停止':'試聴';
}
bgm.onloadedmetadata=bui;
function bseek(x){const d=bgm.duration||0;bgm.currentTime=Math.max(0,Math.min(d,x));bui()}
$('bopen').onclick=()=>{$('sheet').hidden=false;bui()};
$('bok').onclick=()=>{if(bPrev&&!looping){bgm.pause()}bPrev=false;$('sheet').hidden=true;bui()};
$('bplay').onclick=()=>{audioInit();if(actx&&actx.state==='suspended')actx.resume();
  if(!bgm.paused&&bPrev){bgm.pause();bPrev=false}else{bPrev=true;if(bB!=null&&bgm.currentTime>=bB||bgm.currentTime<(bA||0))bgm.currentTime=bA||0;bgm.play().catch(()=>{})}bui()};
$('bback').onclick=()=>bseek(bgm.currentTime-1);
$('bfwd').onclick=()=>bseek(bgm.currentTime+1);
$('bsetA').onclick=()=>{bA=bgm.currentTime;if(bB!=null&&bB<=bA)bB=null;bui()};
$('bsetB').onclick=()=>{const x=bgm.currentTime;if(x>(bA||0)+0.05){bB=x;bgm.currentTime=bA||0}bui()};
$('breset').onclick=()=>{bA=null;bB=null;bui()};
{const t2=$('btl');const sk=e=>{const r=t2.getBoundingClientRect();bseek((e.clientX-r.left)/r.width*(bgm.duration||0))};
 t2.onpointerdown=e=>{t2.setPointerCapture(e.pointerId);sk(e);t2.onpointermove=sk};t2.onpointerup=()=>{t2.onpointermove=null}}
function bgmStop(){if(!bPrev)bgm.pause()}
$('bfile').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  if(bUrl)URL.revokeObjectURL(bUrl);bUrl=URL.createObjectURL(f);bgm.src=bUrl;
  const n=$('bname');n.textContent='♪ '+f.name;n.classList.add('has');$('bclr').disabled=false;$('bopen').disabled=false;bA=null;bB=null;
  audioInit();if(looping&&phase)bgmPlay(true);
};
$('bclr').onclick=()=>{bgmStop();bA=null;bB=null;$('sheet').hidden=true;$('bopen').disabled=true;bui();bgm.removeAttribute('src');bgm.load();if(bUrl)URL.revokeObjectURL(bUrl);bUrl=null;
  const n=$('bname');n.textContent='♪ 裏の音を選ぶ';n.classList.remove('has');$('bclr').disabled=true;$('bfile').value=''};
$('bvol').onchange=()=>{const x=+$('bvol').value;if(gain)gain.gain.value=x;else bgm.volume=x};
let looping=false,phase='',frames=[],times=[],raf=0,t=0,dir=1,last=0,vfcId=0,cancelCap=null;

const fmt=s=>{if(s==null||isNaN(s))return'--';const m=Math.floor(s/60),r=s-m*60;return m+':'+(r<10?'0':'')+r.toFixed(2)};
const dur=()=>v.duration||0;
const pct=s=>(dur()?s/dur()*100:0)+'%';

function ui(){
  const cur=looping?t:v.currentTime;
  $('tN').textContent=fmt(cur);$('head').style.left=pct(cur);
  $('tA').textContent=fmt(A);$('tB').textContent=fmt(B);
  $('mA').style.display=A!=null?'block':'none';$('mA').style.left=pct(A||0);
  $('mB').style.display=B!=null?'block':'none';$('mB').style.left=pct(B||0);
  const r=$('range');
  if(A!=null&&B!=null){r.style.display='block';r.style.left=pct(Math.min(A,B));r.style.width=(Math.abs(B-A)/dur()*100)+'%'}else r.style.display='none';
  const ok=A!=null&&B!=null&&Math.abs(B-A)>0.1;$('go').disabled=!ok;$('exp').disabled=!ok||recOn||(looping&&phase==='capture');
  $('play').textContent=v.paused?'再生':'一時停止';
}

$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  stopLoop();if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(f);v.src=url;A=B=null;$('empty').style.display='none';
  note.textContent=f.name;
};
v.onloadedmetadata=()=>ui();
v.ontimeupdate=ui;v.onplay=ui;v.onpause=ui;
// fpsの推定
if('requestVideoFrameCallback' in HTMLVideoElement.prototype){
  let pm=null,cnt=0,acc=0;
  const est=(n,m)=>{if(pm!=null){const d=m.mediaTime-pm;if(d>0.005&&d<0.1){acc+=d;cnt++;if(cnt>=8){fps=Math.round(cnt/acc);cnt=0;acc=0}}}pm=m.mediaTime;v.requestVideoFrameCallback(est)};
  v.requestVideoFrameCallback(est);
}

function seek(s){stopLoop();v.pause();v.currentTime=Math.max(0,Math.min(dur(),s));ui()}
$('back').onclick=()=>seek(v.currentTime-1/fps);
$('fwd').onclick=()=>seek(v.currentTime+1/fps);
$('play').onclick=()=>{if(!v.src)return;stopLoop();v.muted=false;v.paused?v.play():v.pause()};
$('setA').onclick=()=>{if(!v.src)return;stopLoop();A=v.currentTime;ui()};
$('setB').onclick=()=>{if(!v.src)return;stopLoop();B=v.currentTime;ui()};
$('spd').onchange=()=>{if(looping&&phase==='capture')v.playbackRate=1};

// タイムライン操作
const tl=$('tl');
const tlSeek=e=>{if(!dur())return;const r=tl.getBoundingClientRect();seek((e.clientX-r.left)/r.width*dur())};
tl.onpointerdown=e=>{tl.setPointerCapture(e.pointerId);tlSeek(e);tl.onpointermove=tlSeek};
tl.onpointerup=()=>{tl.onpointermove=null};

$('go').onclick=()=>looping?stopLoop():startLoop();

function clearCache(){frames.forEach(b=>b.close&&b.close());frames=[];times=[]}

function stopLoop(){
  if(!looping)return;
  looping=false;phase='';cancelAnimationFrame(raf);bgmStop();if(cancelCap)cancelCap();expPending=false;if(recOn){recOn=false;rec.onstop=null;try{rec.stop()}catch(e){}setRecUI(false)}
  v.pause();v.muted=false;
  const back=t;clearCache();stage.classList.remove('looping');
  v.currentTime=back;$('go').textContent='往復ループ開始';$('go').classList.remove('on');
  note.textContent='停止しました。';ui();
}

async function startLoop(){
  const a=Math.min(A,B),b=Math.max(A,B);A=a;B=b;
  looping=true;phase='capture';clearCache();bgmPlay(true);
  $('go').textContent='停止';$('go').classList.add('on');
  // 解像度：メモリ上限(約350MB)に収まるよう調整
  const maxH=+$('q').value,est=(b-a)*Math.max(fps,30)+10;
  let s=Math.min(1,maxH/Math.min(v.videoWidth,v.videoHeight));
  const budget=350e6,need=est*v.videoWidth*v.videoHeight*4*s*s;
  if(need>budget)s*=Math.sqrt(budget/need);
  const W=Math.max(2,Math.round(v.videoWidth*s/2)*2),H=Math.max(2,Math.round(v.videoHeight*s/2)*2);
  cv.width=W;cv.height=H;stage.classList.add('looping');
  $('badge').textContent='▶ A→B（準備中）';
  note.textContent='1回目のA→Bで逆再生用のコマを準備しています…';
  v.pause();v.muted=true;v.playbackRate=1;
  await new Promise(r=>{v.onseeked=()=>{v.onseeked=null;r()};v.currentTime=a});
  if(!looping)return;
  const grab=async m=>{
    const bm=await createImageBitmap(v,{resizeWidth:W,resizeHeight:H});
    if(!looping){bm.close();return}
    frames.push(bm);times.push(m);ctx.drawImage(bm,0,0);t=m;ui();
  };
  let done=false;
  const finish=()=>{if(done||!looping)return;done=true;v.pause();cancelCap=null;
    if(frames.length<2){note.textContent='コマを取得できませんでした。範囲を広げてください。';stopLoop();return}
    phase='play';t=times[times.length-1];dir=-1;last=performance.now();
    note.textContent='往復ループ中（'+frames.length+'コマ / '+W+'×'+H+'）';if(expPending){expPending=false;beginRec()}raf=requestAnimationFrame(tick)};
  if('requestVideoFrameCallback' in v){
    const cb=async(n,m)=>{if(done||!looping)return;
      if(m.mediaTime>b+0.001){finish();return}
      await grab(m.mediaTime);
      if(m.mediaTime>=b-0.5/fps){finish();return}
      vfcId=v.requestVideoFrameCallback(cb)};
    vfcId=v.requestVideoFrameCallback(cb);
    v.onended=finish;
    cancelCap=()=>{v.cancelVideoFrameCallback(vfcId);v.onended=null};
    await grab(a);v.play();
  }else{
    // 非対応ブラウザ：1コマずつシークして取得
    let stop=false;cancelCap=()=>{stop=true};
    for(let x=a;x<=b+1e-6&&!stop;x+=1/fps){
      await new Promise(r=>{v.onseeked=()=>{v.onseeked=null;r()};v.currentTime=x});
      if(stop||!looping)return;await grab(x);
    }
    finish();
  }
}

function idx(x){let lo=0,hi=times.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(times[m]<=x)lo=m;else hi=m-1}return lo}

function tick(now){
  if(!looping||phase!=='play')return;
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  const sp=+$('spd').value,a=times[0],b=times[times.length-1];
  t+=dt*sp*dir;
  if(t>=b){t=b-(t-b);dir=-1}
  if(t<=a){if(recOn&&++cycles>=+$('rep').value){t=a;ctx.drawImage(frames[0],0,0);recOn=false;setTimeout(()=>rec.stop(),120);setRecUI(false);note.textContent='書き出し処理中…';ui();raf=requestAnimationFrame(tick);return}t=a+(a-t);dir=1}
  ctx.drawImage(frames[idx(t)],0,0);
  $('badge').textContent=(recOn?'● 録画中 '+(cycles+1)+'/'+$('rep').value+'  ':'')+(dir>0?'▶ A→B':'◀ B→A 逆再生');
  ui();raf=requestAnimationFrame(tick);
}
function pickMime(){
  const c=bUrl?['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']:['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  return c.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
}
function setRecUI(on){const e=$('exp');e.classList.toggle('rec',on);e.textContent=on?'録画中…':'書き出し'}
function beginRec(){
  recMime=pickMime();
  if(!recMime||!cv.captureStream){note.textContent='このブラウザは動画の書き出しに対応していません（Chromeで開いてください）。';return}
  const st=cv.captureStream(fps>=50?60:30);
  if(bUrl&&adest){adest.stream.getAudioTracks().forEach(tr=>st.addTrack(tr))}
  rec=new MediaRecorder(st,{mimeType:recMime,videoBitsPerSecond:cv.height>=1000?16e6:8e6});
  chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:recMime.split(';')[0]});
    const ext=recMime.includes('mp4')?'mp4':'webm';
    const d=$('dl'),old=d.href;if(old)URL.revokeObjectURL(old);
    const name='abloop_'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.'+ext;
    d.href=URL.createObjectURL(blob);d.download=name;d.classList.add('ready');
    d.textContent='保存 '+ext.toUpperCase()+' '+(blob.size/1048576).toFixed(1)+'MB';
    note.textContent='書き出し完了。右の「保存」で保存できます。';ui();
  };
  t=times[0];dir=1;cycles=0;last=performance.now();ctx.drawImage(frames[0],0,0);
  bgmPlay(true);rec.start(500);recOn=true;setRecUI(true);
  note.textContent='録画しています。終わるまでこの画面のままにしてください（往復'+$('rep').value+'回）。';ui();
}
$('exp').onclick=()=>{
  $('dl').classList.remove('ready');$('dl').textContent='保存';
  if(looping&&phase==='play'){beginRec();return}
  expPending=true;startLoop();
};
document.addEventListener('visibilitychange',()=>{last=performance.now()});
ui();
}
</script>
</body>
