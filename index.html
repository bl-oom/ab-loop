<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AB往復ループ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#0e0f12">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700&family=Overpass+Mono:wght@600&display=swap" rel="stylesheet">
<style>
/*
VOICE: 編集室の道具。静かで確実、操作に迷わない。
IDEA: 編集ソフトのタイムライン（IN/OUT点とループ範囲）。
PICTURE: 画面上部いっぱいの映像プレビュー、その下にA-B範囲が光るタイムライン。
COLOUR/TYPE: 黒に近いモニター面、A=シアン、B=マゼンタ、往復中=アンバー無し→白。Zen Kaku Gothic + 等幅数字。
LAYOUT: 縦一列。ボタンは固定グリッドで、状態が変わっても位置は一切動かさない。
*/
:root{color-scheme:dark;--bg:#0e0f12;--panel:#17191e;--line:#2a2d35;--ink:#eef0f4;--mute:#8b909c;--a:#22c7e0;--b:#ef3f8f;--go:#f2f2f2}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Zen Kaku Gothic New",system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 28px}
h1{font-size:20px;margin:4px 2px 10px;font-weight:700;letter-spacing:.02em}
.stage{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:16/9;display:grid;place-items:center;border:1px solid var(--line)}
.stage video,.stage canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.stage canvas{display:none}
.stage.looping canvas{display:block}.stage.looping video{visibility:hidden}
.empty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--mute);padding:20px;cursor:pointer}
.empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:4px}
.badge{position:absolute;left:10px;top:10px;font:600 13px "Overpass Mono",monospace;background:rgba(0,0,0,.6);padding:3px 9px;border-radius:99px;display:none}
.stage.looping .badge{display:block}
.tl{position:relative;height:56px;margin:14px 0 4px;touch-action:none;cursor:pointer}
.track{position:absolute;left:0;right:0;top:22px;height:12px;border-radius:6px;background:var(--panel);border:1px solid var(--line)}
.range{position:absolute;top:22px;height:12px;background:linear-gradient(90deg,var(--a),var(--b));opacity:.55;border-radius:6px;display:none}
.mk{position:absolute;top:6px;width:2px;height:44px;margin-left:-1px;display:none}
.mk span{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font:700 12px "Overpass Mono",monospace;color:#000;border-radius:4px;padding:0 4px}
#mA{background:var(--a)}#mA span{background:var(--a)}#mB{background:var(--b)}#mB span{background:var(--b)}
.head{position:absolute;top:14px;width:4px;height:28px;margin-left:-2px;background:var(--go);border-radius:2px;box-shadow:0 0 0 2px #0008}
.times{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;font:600 14px "Overpass Mono",monospace;margin-bottom:12px}
.times div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 10px;white-space:nowrap}
.times small{display:block;font:500 12px "Zen Kaku Gothic New",sans-serif;color:var(--mute)}
#tA{color:var(--a)}#tB{color:var(--b)}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
button,select,label.btn{font:700 15px "Zen Kaku Gothic New",sans-serif;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:12px;min-height:52px;padding:6px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;text-align:center;line-height:1.2}
button:active{transform:scale(.97)}
button:focus-visible,select:focus-visible{outline:2px solid var(--a);outline-offset:2px}
button:disabled{opacity:.35;cursor:default}
.setA{border-color:var(--a);color:var(--a)}.setB{border-color:var(--b);color:var(--b)}
.go{grid-column:span 4;min-height:64px;font-size:19px;background:var(--go);color:#111;border:0}
.go.on{background:#2b2e36;color:var(--go);border:2px solid var(--go)}
.wide2{grid-column:span 2}
select{appearance:none;font-size:16px}
.exp{border-color:var(--go)}
.exp.rec{background:#c62828;border-color:#c62828;color:#fff}
.dl{display:flex;align-items:center;justify-content:center;margin-top:8px;min-height:52px;border-radius:12px;background:var(--a);color:#001418;font-weight:700;text-decoration:none}
.dl[hidden]{display:none}
input[type=file]{display:none}
.note{color:var(--mute);font-size:13px;margin:12px 2px 0;min-height:20px}
</style>
</head>
<body>
<div class="wrap">
<h1>AB往復ループ</h1>
<div class="stage" id="stage">
  <video id="v" playsinline preload="auto"></video>
  <canvas id="cv"></canvas>
  <div class="badge" id="badge">▶ A→B</div>
  <label class="empty" id="empty" for="file"><div><b>動画を選ぶ</b>端末に保存されている動画をタップして開く</div></label>
</div>

<div class="tl" id="tl">
  <div class="track"></div>
  <div class="range" id="range"></div>
  <div class="mk" id="mA"><span>A</span></div>
  <div class="mk" id="mB"><span>B</span></div>
  <div class="head" id="head" style="left:0"></div>
</div>

<div class="times">
  <div><small>現在</small><span id="tN">0:00.00</span></div>
  <div><small>A点</small><span id="tA">--</span></div>
  <div><small>B点</small><span id="tB">--</span></div>
</div>

<div class="grid">
  <button id="back">◀ 1コマ</button>
  <button id="play">再生</button>
  <button id="fwd">1コマ ▶</button>
  <label class="btn" for="file">動画を変更</label>
  <button class="setA wide2" id="setA">ここをA点に</button>
  <button class="setB wide2" id="setB">ここをB点に</button>
  <button class="go" id="go" disabled>往復ループ開始</button>
  <select id="spd" class="wide2" aria-label="速度">
    <option value="0.25">速度 0.25倍</option><option value="0.5">速度 0.5倍</option>
    <option value="1" selected>速度 1倍</option><option value="1.5">速度 1.5倍</option><option value="2">速度 2倍</option>
  </select>
  <select id="q" class="wide2" aria-label="画質">
    <option value="540">画質 軽め</option><option value="720" selected>画質 標準</option><option value="1080">画質 高め</option>
  </select>
  <select id="rep" class="wide2" aria-label="往復回数">
    <option value="1">往復 1回</option><option value="2">往復 2回</option><option value="3" selected>往復 3回</option>
    <option value="5">往復 5回</option><option value="10">往復 10回</option><option value="20">往復 20回</option>
  </select>
  <button id="exp" class="wide2 exp" disabled>動画に書き出し</button>
</div>
<a id="dl" class="dl" hidden>書き出した動画を保存</a>
<p class="note" id="note">A点とB点を決めて「往復ループ開始」。B→Aは逆再生になります（ループ中は無音）。</p>
<input type="file" id="file" accept="video/*">
</div>

<script>
{
const $=id=>document.getElementById(id);
const v=$('v'),cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage'),note=$('note');
let A=null,B=null,url=null,fps=30;
let rec=null,chunks=[],recOn=false,expPending=false,cycles=0,recMime='';
let looping=false,phase='',frames=[],times=[],raf=0,t=0,dir=1,last=0,vfcId=0,cancelCap=null;

const fmt=s=>{if(s==null||isNaN(s))return'--';const m=Math.floor(s/60),r=s-m*60;return m+':'+(r<10?'0':'')+r.toFixed(2)};
const dur=()=>v.duration||0;
const pct=s=>(dur()?s/dur()*100:0)+'%';

function ui(){
  const cur=looping?t:v.currentTime;
  $('tN').textContent=fmt(cur);$('head').style.left=pct(cur);
  $('tA').textContent=fmt(A);$('tB').textContent=fmt(B);
  $('mA').style.display=A!=null?'block':'none';$('mA').style.left=pct(A||0);
  $('mB').style.display=B!=null?'block':'none';$('mB').style.left=pct(B||0);
  const r=$('range');
  if(A!=null&&B!=null){r.style.display='block';r.style.left=pct(Math.min(A,B));r.style.width=(Math.abs(B-A)/dur()*100)+'%'}else r.style.display='none';
  const ok=A!=null&&B!=null&&Math.abs(B-A)>0.1;$('go').disabled=!ok;$('exp').disabled=!ok||recOn||(looping&&phase==='capture');
  $('play').textContent=v.paused?'再生':'一時停止';
}

$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  stopLoop();if(url)URL.revokeObjectURL(url);
  url=URL.createObjectURL(f);v.src=url;A=B=null;$('empty').style.display='none';
  note.textContent=f.name;
};
v.onloadedmetadata=()=>{stage.style.aspectRatio=v.videoWidth+'/'+v.videoHeight;ui()};
v.ontimeupdate=ui;v.onplay=ui;v.onpause=ui;
// fpsの推定
if('requestVideoFrameCallback' in HTMLVideoElement.prototype){
  let pm=null,cnt=0,acc=0;
  const est=(n,m)=>{if(pm!=null){const d=m.mediaTime-pm;if(d>0.005&&d<0.1){acc+=d;cnt++;if(cnt>=8){fps=Math.round(cnt/acc);cnt=0;acc=0}}}pm=m.mediaTime;v.requestVideoFrameCallback(est)};
  v.requestVideoFrameCallback(est);
}

function seek(s){stopLoop();v.pause();v.currentTime=Math.max(0,Math.min(dur(),s));ui()}
$('back').onclick=()=>seek(v.currentTime-1/fps);
$('fwd').onclick=()=>seek(v.currentTime+1/fps);
$('play').onclick=()=>{if(!v.src)return;stopLoop();v.muted=false;v.paused?v.play():v.pause()};
$('setA').onclick=()=>{if(!v.src)return;stopLoop();A=v.currentTime;ui()};
$('setB').onclick=()=>{if(!v.src)return;stopLoop();B=v.currentTime;ui()};
$('spd').onchange=()=>{if(looping&&phase==='capture')v.playbackRate=1};

// タイムライン操作
const tl=$('tl');
const tlSeek=e=>{if(!dur())return;const r=tl.getBoundingClientRect();seek((e.clientX-r.left)/r.width*dur())};
tl.onpointerdown=e=>{tl.setPointerCapture(e.pointerId);tlSeek(e);tl.onpointermove=tlSeek};
tl.onpointerup=()=>{tl.onpointermove=null};

$('go').onclick=()=>looping?stopLoop():startLoop();

function clearCache(){frames.forEach(b=>b.close&&b.close());frames=[];times=[]}

function stopLoop(){
  if(!looping)return;
  looping=false;phase='';cancelAnimationFrame(raf);if(cancelCap)cancelCap();expPending=false;if(recOn){recOn=false;rec.onstop=null;try{rec.stop()}catch(e){}setRecUI(false)}
  v.pause();v.muted=false;
  const back=t;clearCache();stage.classList.remove('looping');
  v.currentTime=back;$('go').textContent='往復ループ開始';$('go').classList.remove('on');
  note.textContent='停止しました。';ui();
}

async function startLoop(){
  const a=Math.min(A,B),b=Math.max(A,B);A=a;B=b;
  looping=true;phase='capture';clearCache();
  $('go').textContent='停止';$('go').classList.add('on');
  // 解像度：メモリ上限(約350MB)に収まるよう調整
  const maxH=+$('q').value,est=(b-a)*Math.max(fps,30)+10;
  let s=Math.min(1,maxH/Math.min(v.videoWidth,v.videoHeight));
  const budget=350e6,need=est*v.videoWidth*v.videoHeight*4*s*s;
  if(need>budget)s*=Math.sqrt(budget/need);
  const W=Math.max(2,Math.round(v.videoWidth*s/2)*2),H=Math.max(2,Math.round(v.videoHeight*s/2)*2);
  cv.width=W;cv.height=H;stage.classList.add('looping');
  $('badge').textContent='▶ A→B（準備中）';
  note.textContent='1回目のA→Bで逆再生用のコマを準備しています…';
  v.pause();v.muted=true;v.playbackRate=1;
  await new Promise(r=>{v.onseeked=()=>{v.onseeked=null;r()};v.currentTime=a});
  if(!looping)return;
  const grab=async m=>{
    const bm=await createImageBitmap(v,{resizeWidth:W,resizeHeight:H});
    if(!looping){bm.close();return}
    frames.push(bm);times.push(m);ctx.drawImage(bm,0,0);t=m;ui();
  };
  let done=false;
  const finish=()=>{if(done||!looping)return;done=true;v.pause();cancelCap=null;
    if(frames.length<2){note.textContent='コマを取得できませんでした。範囲を広げてください。';stopLoop();return}
    phase='play';t=times[times.length-1];dir=-1;last=performance.now();
    note.textContent='往復ループ中（'+frames.length+'コマ / '+W+'×'+H+'）';if(expPending){expPending=false;beginRec()}raf=requestAnimationFrame(tick)};
  if('requestVideoFrameCallback' in v){
    const cb=async(n,m)=>{if(done||!looping)return;
      if(m.mediaTime>b+0.001){finish();return}
      await grab(m.mediaTime);
      if(m.mediaTime>=b-0.5/fps){finish();return}
      vfcId=v.requestVideoFrameCallback(cb)};
    vfcId=v.requestVideoFrameCallback(cb);
    v.onended=finish;
    cancelCap=()=>{v.cancelVideoFrameCallback(vfcId);v.onended=null};
    await grab(a);v.play();
  }else{
    // 非対応ブラウザ：1コマずつシークして取得
    let stop=false;cancelCap=()=>{stop=true};
    for(let x=a;x<=b+1e-6&&!stop;x+=1/fps){
      await new Promise(r=>{v.onseeked=()=>{v.onseeked=null;r()};v.currentTime=x});
      if(stop||!looping)return;await grab(x);
    }
    finish();
  }
}

function idx(x){let lo=0,hi=times.length-1;while(lo<hi){const m=(lo+hi+1)>>1;if(times[m]<=x)lo=m;else hi=m-1}return lo}

function tick(now){
  if(!looping||phase!=='play')return;
  const dt=Math.min(0.1,(now-last)/1000);last=now;
  const sp=+$('spd').value,a=times[0],b=times[times.length-1];
  t+=dt*sp*dir;
  if(t>=b){t=b-(t-b);dir=-1}
  if(t<=a){if(recOn&&++cycles>=+$('rep').value){t=a;ctx.drawImage(frames[0],0,0);recOn=false;setTimeout(()=>rec.stop(),120);setRecUI(false);note.textContent='書き出し処理中…';ui();raf=requestAnimationFrame(tick);return}t=a+(a-t);dir=1}
  ctx.drawImage(frames[idx(t)],0,0);
  $('badge').textContent=(recOn?'● 録画中 '+(cycles+1)+'/'+$('rep').value+'  ':'')+(dir>0?'▶ A→B':'◀ B→A 逆再生');
  ui();raf=requestAnimationFrame(tick);
}
function pickMime(){
  const c=['video/mp4;codecs=avc1.640028','video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
  return c.find(m=>window.MediaRecorder&&MediaRecorder.isTypeSupported(m))||'';
}
function setRecUI(on){const e=$('exp');e.classList.toggle('rec',on);e.textContent=on?'録画中…':'動画に書き出し'}
function beginRec(){
  recMime=pickMime();
  if(!recMime||!cv.captureStream){note.textContent='このブラウザは動画の書き出しに対応していません（Chromeで開いてください）。';return}
  const st=cv.captureStream(fps>=50?60:30);
  rec=new MediaRecorder(st,{mimeType:recMime,videoBitsPerSecond:cv.height>=1000?16e6:8e6});
  chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{
    const blob=new Blob(chunks,{type:recMime.split(';')[0]});
    const ext=recMime.includes('mp4')?'mp4':'webm';
    const d=$('dl'),old=d.href;if(old)URL.revokeObjectURL(old);
    const name='abloop_'+new Date().toISOString().slice(0,19).replace(/[-:T]/g,'')+'.'+ext;
    d.href=URL.createObjectURL(blob);d.download=name;d.hidden=false;
    d.textContent='保存する（'+ext.toUpperCase()+' '+(blob.size/1048576).toFixed(1)+'MB）';
    note.textContent='書き出し完了。下のボタンで保存できます。';ui();
  };
  t=times[0];dir=1;cycles=0;last=performance.now();ctx.drawImage(frames[0],0,0);
  rec.start(500);recOn=true;setRecUI(true);
  note.textContent='録画しています。終わるまでこの画面のままにしてください（往復'+$('rep').value+'回）。';ui();
}
$('exp').onclick=()=>{
  $('dl').hidden=true;
  if(looping&&phase==='play'){beginRec();return}
  expPending=true;startLoop();
};
document.addEventListener('visibilitychange',()=>{last=performance.now()});
ui();
}
</script>
</body>
</html>
